<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tatiana & Paulo · 17 Abril 2027</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        /* Ecrã de capa inicial com a imagem e overlay escuro */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .cover-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        /* Camada escura de fundo */
        .cover-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        /* Botão no meio do ecrã: fundo preto, letras brancas e borda branca */
        .start-btn {
            position: relative;
            z-index: 3;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 18px 40px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        /* Efeito ao passar o rato ou tocar */
        .start-btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Contentor do vídeo nativo */
        .video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: none; /* Oculto até clicar */
            background-color: #000;
        }

        /* Vídeo em ecrã inteiro */
        .video-container video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Ecrã inicial com imagem de capa, overlay escuro e botão flutuante no centro -->
    <div id="start-screen">
        <img class="cover-image" src="https://raw.githubusercontent.com/gui1994-code/wed/99a1521db6d66648bd1ee765666f43d6b6fabc22/1031-Cover.jpg" alt="Capa">
        <div class="cover-overlay"></div>
        <button class="start-btn" onclick="startExperience()">Press to start</button>
    </div>

    <!-- Contentor do Vídeo Nativo (.mp4) -->
    <div class="video-container" id="videoContainer">
        <video id="bgVideo" playsinline loop preload="auto">
            <source src="https://github.com/gui1994-code/wed/releases/download/1.0/1031.mp4" type="video/mp4">
            O seu navegador não suporta vídeos.
        </video>
    </div>

    <script>
        function startExperience() {
            // Esconde o ecrã inicial de capa
            document.getElementById('start-screen').style.display = 'none';
            
            // Mostra o vídeo
            const container = document.getElementById('videoContainer');
            container.style.display = 'block';
            
            // Liga o som e inicia o vídeo
            const video = document.getElementById('bgVideo');
            video.muted = false; 
            video.play().catch(error => {
                console.log("Erro ao reproduzir o vídeo:", error);
            });
        }
    </script>

</body>
</html>
